{% load static %} <!-- Lets the images load-->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title> StudySoft - Login </title>

  <style>
    body {
      background: #f0f8ff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .15);
      width: 300px;
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5rem 0 5rem 0;
      gap: 4 rem;
    }

    input {
      width: 100%;
      padding: .5rem;
      margin: .4rem 0 1rem;
      box-sizing: border-box;
    }

    .error {
      color: #c00;
    }

 button, .btn-link {
  display: block;
  width: 100%;
  padding: .6rem;
  margin: 0;
  background:cornflowerblue;
  color: black;
  border-radius: 6px;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  box-sizing: border-box;
}
button:hover, .btn-link:hover {
  
  background: lightskyblue;
}



  </style>
</head>

<body>

  <div class="login-brand">
    <div>
      <img src="{% static 'images/studySoft-Logo-main.png' %}" alt="logo" style="width:14rem; height:14rem;">
  
    </div>

    <br>

    <div>
      <form class="card" method="post">
        {% csrf_token %}
        <h2>Login</h2>
        {% if form.errors %}<p class="error">Invalid username or password.</p>{% endif %}
        <label>Username</label>{{ form.username }}
        <label>Password</label>{{ form.password }}
        <button type="submit" class="btn-link">Log in</button>
        <p> Dont have an account? Sign Up </p>
        <a href="{% url 'signup' %}" class="btn-link">Sign up</a>

      </form>
    </div>
  </div>
</body>

</html>
